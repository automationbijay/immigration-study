schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  properties:
    auth_state_json:
      type: string
      description: Paste the contents of myimmitracker_auth_state.json here to bypass login.
    run_citizenship_processing_tracker:
      type: boolean
      description: Run the Citizenship Processing Tracker?
      default: true
    run_consolidated_sc491_visa_tracker:
      type: boolean
      description: Run the Consolidated Sc491 Visa Tracker?
      default: true
    run_consolidated_visa_tracker_sc189:
      type: boolean
      description: Run the Consolidated Visa Tracker Sc189?
      default: true
    run_consolidated_visa_tracker_sc190:
      type: boolean
      description: Run the Consolidated Visa Tracker Sc190?
      default: true
    run_consolidated_visa_tracker_sc191:
      type: boolean
      description: Run the Consolidated Visa Tracker Sc191?
      default: true
    run_expression_of_interest_sc189_tracker:
      type: boolean
      description: Run the Expression Of Interest Sc189 Tracker?
      default: true
    run_expression_of_interest_sc190_tracker:
      type: boolean
      description: Run the Expression Of Interest Sc190 Tracker?
      default: true
    run_indian_applicants_sc189_visa_tracker:
      type: boolean
      description: Run the Indian Applicants Sc189 Visa Tracker?
      default: true
    run_indian_applicants_sc190_visa_tracker:
      type: boolean
      description: Run the Indian Applicants Sc190 Visa Tracker?
      default: true
    run_sc491_eoi_tracker:
      type: boolean
      description: Run the Sc491 Eoi Tracker?
      default: true
    run_skills_assessment_tracker:
      type: boolean
      description: Run the Skills Assessment Tracker?
      default: true
  required:
    - auth_state_json
