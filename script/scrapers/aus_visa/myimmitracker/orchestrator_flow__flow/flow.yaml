    - id: run_expression_of_interest_sc189_tracker_step
      value:
        type: script
        input_transforms:
          auth_state_json:
            type: javascript
            expr: flow_input.auth_state_json
        path: f/aus_visa/myimmitracker/expression_of_interest_sc189_tracker
      skip_if:
        expr: '!flow_input.run_expression_of_interest_sc189_tracker'
    - id: upsert_expression_of_interest_sc189_tracker_step
      value:
        type: script
        input_transforms:
          db:
            type: static
            value: $res:u/puribijay/immigraion-abroad
          scraped_data:
            type: javascript
            expr: results.run_expression_of_interest_sc189_tracker_step
          table_name:
            type: javascript
            expr: '"scr_myimmitracker_expression_of_interest_sc189_tracker"'
        path: f/aus_visa/myimmitracker/supabase_upsert
      skip_if:
        expr: '!flow_input.run_expression_of_interest_sc189_tracker'
