summary: Upsert Scraped Data to Supabase
description: Dynamically maps scraped JSON arrays into strict Supabase columns
  and upserts them.
lock: '!inline f/aus_visa/myimmitracker/supabase_upsert.script.lock'
kind: script
schema:
  properties:
    db:
      type: object
      description: ''
      default: null
      format: resource-postgresql
    scraped_data:
      type: array
      description: ''
      default: null
      items:
        type: string
      originalType: string[]
    table_name:
      type: string
      description: ''
      default: null
      originalType: string
  required:
    - table_name
    - scraped_data
    - db
